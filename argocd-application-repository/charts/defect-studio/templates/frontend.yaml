{{- if .Values.frontend.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.namePrefix }}-frontend
  labels:
    app.kubernetes.io/name: defect-studio
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: defect-studio
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/frontend-nginx: {{ include (print $.Template.BasePath "/frontend-nginx.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: defect-studio
        app.kubernetes.io/component: frontend
    spec:
      volumes:
        - name: nginx-headers
          configMap:
            name: {{ .Values.namePrefix }}-frontend-nginx
      imagePullSecrets:
        {{- range .Values.frontend.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
          volumeMounts:
            - name: nginx-headers
              mountPath: /etc/nginx/conf.d/00-header-buffers.conf
              subPath: header-buffers.conf
              readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.namePrefix }}-frontend
  labels:
    app.kubernetes.io/name: defect-studio
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: defect-studio
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
{{- end }}

