server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container platform health check.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA is served under the /defect prefix (built with base=/defect/).
    # /defect (no trailing slash) is redirected to /defect/ by Istio already;
    # keep a fallback here for direct pod traffic.
    location = /defect {
        return 308 /defect/;
    }

    location /defect/ {
        alias /usr/share/nginx/html/defect/;
        try_files $uri $uri/ /defect/index.html;
    }

    # Nothing else is served from this pod.
    location / {
        return 404;
    }
}
