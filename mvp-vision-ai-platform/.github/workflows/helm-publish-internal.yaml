name: Publish Internal

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/helm-publish-internal.yaml'
      - 'dashboard/**'
      - 'web-auth/**'
      - 'docs-site/**'
      - 'platform/backend/**'
      - 'platform/agent-backend/**'
      - 'platform/frontend/**'
      - 'dashboard/mcp-server/**'
      - 'platform/mcp-server/**'
      - 'platform/dice-agent-core/**'
      - 'platform/dice-platform-runtime/**'
      - 'platform/dice-dataset-cache/**'
      - 'platform/trainers/**'
      - 'platform/scripts/pack_runner_env.sh'
      - 'platform/scripts/upload_runner_env_bundle.py'
      - 'docs/runner/**'
      - 'runner/**'
      - 'infrastructure/helm/vision-ai-platform/**'
      - 'infrastructure/helm/environments/stage-shared-inference.json'
      - 'infrastructure/scripts/configure-stage-shared-inference.sh'
      - 'labeler/backend/**'
      - 'labeler/inference-gateway/**'
      - 'labeler/frontend/**'
      - 'dice-bot/**'
      - 'user-service/**'
  workflow_dispatch:
    inputs:
      components:
        description: 'Components to build (all, web-auth, docs, backend, frontend, dashboard, mcp, dashboard-mcp, trainers, dataset-cache, runner, labeler, labeler-backend, labeler-frontend, inference-gateway, dice-bot, user-service, chart)'
        required: false
        default: 'backend,frontend'
        type: string
      tag_override:
        description: 'Override image tag (leave empty for CalVer)'
        required: false
        type: string
      candidate_upload_enabled:
        description: 'Enable candidate upload in a staging-only Labeler frontend image'
        required: false
        type: boolean
        default: false
      skip_sync:
        description: 'Skip ArgoCD sync after build'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: dice-docker-local.bart.sec.samsung.net
  ARGOCD_APP_NAME: dice-stage
  ARGOCD_CLI_URL: ${{ vars.ARGOCD_CLI_URL || 'https://bart.sec.samsung.net/artifactory/dice-generic-local/argocd-linux-amd64' }}
  ARGOCD_CLI_SHA256: ${{ vars.ARGOCD_CLI_SHA256 || '' }}
  DOCKER_BUILDKIT: "1"
  SPACE_CODE_STORAGE_PREFIX: ${{ vars.SPACE_CODE_STORAGE_PREFIX || 'space-code' }}
  SPACE_CODE_STORAGE_REGION: ${{ vars.SPACE_CODE_STORAGE_REGION || vars.S3_REGION || 'us-east-1' }}
  SPACE_CODE_NO_VERIFY_SSL: ${{ vars.SPACE_CODE_NO_VERIFY_SSL || 'false' }}

jobs:
  setup:
    runs-on: [code-linux, code-xlarge]
    outputs:
      web_auth: ${{ steps.changes.outputs.web_auth }}
      docs: ${{ steps.changes.outputs.docs }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      dashboard_mcp: ${{ steps.changes.outputs.dashboard_mcp }}
      dashboard: ${{ steps.changes.outputs.dashboard }}
      mcp: ${{ steps.changes.outputs.mcp }}
      trainers: ${{ steps.changes.outputs.trainers }}
      dataset_cache: ${{ steps.changes.outputs.dataset_cache }}
      runner: ${{ steps.changes.outputs.runner }}
      labeler_backend: ${{ steps.changes.outputs.labeler_backend }}
      inference_gateway: ${{ steps.changes.outputs.inference_gateway }}
      labeler_frontend: ${{ steps.changes.outputs.labeler_frontend }}
      dice_bot: ${{ steps.changes.outputs.dice_bot }}
      user_service: ${{ steps.changes.outputs.user_service }}
      chart_changed: ${{ steps.changes.outputs.chart_changed }}
      trainer_list: ${{ steps.trainers.outputs.list }}
      changed_trainers: ${{ steps.detect_trainers.outputs.changed }}
      labeler_frontend_tag: ${{ steps.tag.outputs.labeler_frontend_tag }}
      tag: ${{ steps.tag.outputs.tag }}
      date: ${{ steps.tag.outputs.date }}
    steps:
      - name: Check if internal mirror
        id: check
        run: |
          if [ "${{ vars.ENABLE_HELM_PUBLISH }}" = "true" ]; then
            echo "Running in internal mirror repository"
          else
            echo "::warning::Skipping - ENABLE_HELM_PUBLISH is not set to 'true'"
            echo "::warning::Set repository variable ENABLE_HELM_PUBLISH=true in internal mirror"
            exit 1
          fi

      - name: Checkout
        uses: code-actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_USERTOKEN }}

      - name: Detect changes
        id: changes
        env:
          CANDIDATE_UPLOAD_ENABLED: ${{ inputs.candidate_upload_enabled && 'true' || 'false' }}
        run: |
          WEB=false
          WEB_AUTH=false
          DOCS=false
          BACKEND=false
          FRONTEND=false
          DASHBOARD=false
          DASHBOARD_MCP=false
          MCP=false
          TRAINERS=false
          DATASET_CACHE=false
          RUNNER=false
          LABELER_BACKEND=false
          INFERENCE_GATEWAY=false
          LABELER_FRONTEND=false
          DICE_BOT=false
          USER_SERVICE=false
          CHART_CHANGED=false

          EVENT="${{ github.event_name }}"
          COMPONENTS="${{ github.event.inputs.components }}"
          COMPONENTS="$(printf '%s' "$COMPONENTS" | tr '[:upper:]' '[:lower:]' | tr '_' '-' | tr -d '[:space:]')"

          requested() {
            [ "$COMPONENTS" = "all" ] || printf ',%s,' "$COMPONENTS" | grep -q ",$1,"
          }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Components requested: ${COMPONENTS:-backend,frontend}"
            if [ -z "$COMPONENTS" ] || requested "all"; then
              BACKEND=true
              FRONTEND=true
              DASHBOARD=true
              DASHBOARD_MCP=true
              MCP=true
              WEB_AUTH=true
              DOCS=true
              TRAINERS=true
              DATASET_CACHE=true
              RUNNER=true
              LABELER_BACKEND=true
              INFERENCE_GATEWAY=true
              LABELER_FRONTEND=true
              DICE_BOT=true
              USER_SERVICE=true
              CHART_CHANGED=true
            else
              requested "backend" && BACKEND=true
              requested "frontend" && FRONTEND=true
              requested "dashboard" && DASHBOARD=true
              requested "dashboard-mcp" && DASHBOARD_MCP=true
              requested "mcp" && MCP=true
              requested "web" && WEB=true
              requested "web-auth" && WEB_AUTH=true
              requested "docs" && DOCS=true
              requested "trainers" && TRAINERS=true
              requested "dataset-cache" && DATASET_CACHE=true
              requested "runner" && RUNNER=true
              if requested "labeler"; then
                INFERENCE_GATEWAY=true
                LABELER_BACKEND=true
                LABELER_FRONTEND=true
              fi
              requested "labeler-backend" && LABELER_BACKEND=true
              requested "inference-gateway" && INFERENCE_GATEWAY=true
              requested "labeler-frontend" && LABELER_FRONTEND=true
              requested "dice-bot" && DICE_BOT=true
              requested "user-service" && USER_SERVICE=true
              requested "chart" && CHART_CHANGED=true
            fi
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="$(git rev-list --max-parents=0 "$HEAD" | tail -n 1)"
            fi

            CHANGED_FILES="$(git diff --name-only "$BASE" "$HEAD")"
            echo "Changed files:"
            printf '%s\n' "$CHANGED_FILES"

            matches_changed() {
              printf '%s\n' "$CHANGED_FILES" | grep -Eq "$1"
            }

            matches_changed '^platform/backend/' && BACKEND=true
            matches_changed '^platform/trainers/[^/]+/capabilities\.json$' && BACKEND=true
            matches_changed '^platform/agent-backend/' && BACKEND=true
            matches_changed '^platform/dice-agent-core/' && BACKEND=true
            matches_changed '^platform/frontend/' && FRONTEND=true
            matches_changed '^dashboard/(backend|frontend)/' && DASHBOARD=true
            matches_changed '^dashboard/mcp-server/' && DASHBOARD_MCP=true
            matches_changed '^platform/mcp-server/' && MCP=true
            matches_changed '^platform/dice-agent-core/' && MCP=true
            matches_changed '^web/' && WEB=true
            matches_changed '^web-auth/' && WEB_AUTH=true
            matches_changed '^docs-site/' && DOCS=true
            matches_changed '^labeler/frontend/packages/dice-ui/' && FRONTEND=true
            matches_changed '^platform/dice-platform-runtime/' && TRAINERS=true
            matches_changed '^platform/dice-dataset-cache/' && DATASET_CACHE=true
            matches_changed '^platform/trainers/' && TRAINERS=true
            matches_changed '^platform/scripts/(pack_runner_env\.sh|upload_runner_env_bundle\.py)$' && RUNNER=true
            matches_changed '^docs/runner/' && RUNNER=true
            matches_changed '^runner/' && RUNNER=true
            matches_changed '^labeler/backend/' && LABELER_BACKEND=true
            matches_changed '^labeler/inference-gateway/' && INFERENCE_GATEWAY=true
            matches_changed '^infrastructure/(helm/environments/stage-shared-inference\.json|scripts/configure-stage-shared-inference\.sh)$' && INFERENCE_GATEWAY=true
            matches_changed '^labeler/frontend/' && LABELER_FRONTEND=true
            matches_changed '^dice-bot/' && DICE_BOT=true
            matches_changed '^user-service/' && USER_SERVICE=true
            matches_changed '^infrastructure/helm/(vision-ai-platform|environments|argocd)/' && CHART_CHANGED=true
            matches_changed '^\.github/workflows/helm-publish-internal\.yaml$' && CHART_CHANGED=true
          fi

          if [ "$CANDIDATE_UPLOAD_ENABLED" = "true" ] && [ "$LABELER_FRONTEND" != "true" ]; then
            echo "::error::candidate_upload_enabled requires components to include labeler-frontend"
            exit 1
          fi

          {
            echo "web=$WEB"
            echo "web_auth=$WEB_AUTH"
            echo "docs=$DOCS"
            echo "backend=$BACKEND"
            echo "frontend=$FRONTEND"
            echo "dashboard=$DASHBOARD"
            echo "dashboard_mcp=$DASHBOARD_MCP"
            echo "mcp=$MCP"
            echo "trainers=$TRAINERS"
            echo "dataset_cache=$DATASET_CACHE"
            echo "runner=$RUNNER"
            echo "labeler_backend=$LABELER_BACKEND"
            echo "inference_gateway=$INFERENCE_GATEWAY"
            echo "labeler_frontend=$LABELER_FRONTEND"
            echo "dice_bot=$DICE_BOT"
            echo "user_service=$USER_SERVICE"
            echo "chart_changed=$CHART_CHANGED"
          } >> "$GITHUB_OUTPUT"

          echo "Selection:"
          echo "  web=$WEB"
          echo "  web_auth=$WEB_AUTH"
          echo "  docs=$DOCS"
          echo "  backend=$BACKEND"
          echo "  frontend=$FRONTEND"
          echo "  dashboard=$DASHBOARD"
          echo "  trainers=$TRAINERS"
          echo "  dataset_cache=$DATASET_CACHE"
          echo "  runner=$RUNNER"
          echo "  labeler_backend=$LABELER_BACKEND"
          echo "  labeler_frontend=$LABELER_FRONTEND"
          echo "  dice_bot=$DICE_BOT"
          echo "  user_service=$USER_SERVICE"
          echo "  chart_changed=$CHART_CHANGED"

      - name: List trainers
        id: trainers
        run: |
          TRAINERS=$(find platform/trainers -maxdepth 2 -name "Dockerfile" -exec dirname {} \; | xargs -I{} basename {} | tr '\n' ',' | sed 's/,$//')
          echo "list=$TRAINERS" >> "$GITHUB_OUTPUT"
          echo "Found trainers: $TRAINERS"

      - name: Detect changed trainers
        id: detect_trainers
        run: |
          EVENT="${{ github.event_name }}"
          CHANGED_TRAINERS='[]'

          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Force build all trainers on manual trigger
            CHANGED_TRAINERS='["ultralytics","huggingface","vfm-v1","vfm-v3-det-bastion","dice_v1","timm","openmm","space"]'
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="$(git rev-list --max-parents=0 "$HEAD" | tail -n 1)"
            fi

            CHANGED_FILES="$(git diff --name-only "$BASE" "$HEAD")"

            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^platform/dice-platform-runtime/'; then
              # Every trainer image bakes dice-platform-runtime in at build time
              # (COPY dice-platform-runtime + pip install), and every Space code
              # bundle re-embeds its source (see the "Upload Space Trainer Code
              # Bundle" step below). A change here invalidates all of them, so
              # treat it the same as the workflow_dispatch "build everything"
              # path instead of relying on per-directory diffs to catch it.
              echo "dice-platform-runtime changed; rebuilding all trainers"
              CHANGED_TRAINERS='["ultralytics","huggingface","vfm-v1","vfm-v3-det-bastion","dice_v1","timm","openmm","space"]'
            else
              # Extract changed trainer directories from platform/trainers/{trainer}/*
              TRAINERS=$(printf '%s\n' "$CHANGED_FILES" | grep -E '^platform/trainers/[^/]+' | cut -d'/' -f3 | sort -u)

              # Convert to JSON array
              if [ -n "$TRAINERS" ]; then
                CHANGED_TRAINERS=$(printf '%s\n' "$TRAINERS" | jq -R . | jq -cs .)
              fi
            fi
          fi

          echo "changed=$CHANGED_TRAINERS" >> "$GITHUB_OUTPUT"
          echo "Changed trainers: $CHANGED_TRAINERS"

      - name: Generate CalVer tag
        id: tag
        env:
          CANDIDATE_UPLOAD_ENABLED: ${{ inputs.candidate_upload_enabled && 'true' || 'false' }}
        run: |
          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            TAG="${{ github.event.inputs.tag_override }}"
          else
            DATE=$(date +'%Y.%m.%d')
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            TAG="${DATE}-${SHORT_SHA}"
          fi
          LABELER_FRONTEND_TAG="$TAG"
          if [ "$CANDIDATE_UPLOAD_ENABLED" = "true" ]; then
            LABELER_FRONTEND_TAG="${TAG}-candidate-upload"
          fi
          echo "labeler_frontend_tag=$LABELER_FRONTEND_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "date=$(date +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

  build-platform:
    needs: [setup]
    if: needs.setup.outputs.backend == 'true' || needs.setup.outputs.frontend == 'true'
    runs-on: [code-linux, code-xlarge]
    steps:
      - name: Checkout
        uses: code-actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_USERTOKEN }}

      - name: Prepare Docker client config
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: code-actions/docker-setup-buildx-action@v3
        with:
          name: build-platform-${{ github.run_id }}-${{ github.run_attempt }}
          driver: docker-container
          use: true

      - name: Login to Registry
        uses: code-actions/docker-login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        if: needs.setup.outputs.backend == 'true'
        uses: code-actions/docker-build-push-action@v5
        with:
          context: ./platform
          file: ./platform/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/dice-platform-backend:${{ needs.setup.outputs.tag }}
            ${{ env.REGISTRY }}/dice-platform-backend:latest
          build-args: |
            REGISTRY_MIRROR=docker-remote.bart.sec.samsung.net/
            GHCR_MIRROR=ghcr-docker-remote.bart.sec.samsung.net/
            BUILD_DATE=${{ needs.setup.outputs.date }}
            VERSION=${{ needs.setup.outputs.tag }}

      - name: Build and Push Frontend
        if: needs.setup.outputs.frontend == 'true'
        uses: code-actions/docker-build-push-action@v5
        with:
          context: .
          file: ./platform/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/dice-platform-frontend:${{ needs.setup.outputs.tag }}
            ${{ env.REGISTRY }}/dice-platform-frontend:latest
          build-args: |
            REGISTRY_MIRROR=docker-remote.bart.sec.samsung.net/
            BUILD_DATE=${{ needs.setup.outputs.date }}
            VERSION=${{ needs.setup.outputs.tag }}
            NEXT_PUBLIC_API_URL=/platform/api/v1
            NEXT_PUBLIC_USER_API_URL=/user/api/v1
            NEXT_PUBLIC_LABELER_API_URL=/labeler/api/v1
            NEXT_PUBLIC_BASE_PATH=/platform
            NEXT_PUBLIC_LABELER_FRONTEND_URL=/labeler
            NEXT_PUBLIC_HOME_URL=/
            NEXT_PUBLIC_LABELER_URL=/labeler
            NEXT_PUBLIC_PLATFORM_URL=/platform
            NEXT_PUBLIC_RUNNER_URL=/runner
            NEXT_PUBLIC_DOCS_URL=/docs/ko/guide/overview
            NEXT_PUBLIC_ACTIVATION_URL=/activation
            NEXT_PUBLIC_DOWNLOADS_URL=/downloads

  build-dataset-cache:
    needs: [setup]
    if: needs.setup.outputs.dataset_cache == 'true'
    runs-on: [code-linux, code-xlarge]
    steps:
      - name: Checkout
        uses: code-actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_USERTOKEN }}

      - name: Prepare Docker client config
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: code-actions/docker-setup-buildx-action@v3
        with:
          name: build-dataset-cache-${{ github.run_id }}-${{ github.run_attempt }}
          driver: docker-container
          use: true

      - name: Login to Registry
        uses: code-actions/docker-login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Dataset Cache Worker
        uses: code-actions/docker-build-push-action@v5
        with:
          context: ./platform
          file: ./platform/dice-dataset-cache/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/vision-ai-dataset-cache:${{ needs.setup.outputs.tag }}
            ${{ env.REGISTRY }}/vision-ai-dataset-cache:latest
          build-args: |
            REGISTRY_MIRROR=docker-remote.bart.sec.samsung.net/
            BUILD_DATE=${{ needs.setup.outputs.date }}
            VERSION=${{ needs.setup.outputs.tag }}

  build-dashboard-mcp:
    needs: [setup]
    if: needs.setup.outputs.dashboard_mcp == 'true'
    runs-on: [code-linux, code-xlarge]
    steps:
      - name: Checkout
        uses: code-actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_USERTOKEN }}

      - name: Prepare Docker client config
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: code-actions/docker-setup-buildx-action@v3
        with:
          name: build-dashboard-mcp-${{ github.run_id }}-${{ github.run_attempt }}
          driver: docker-container
          use: true

      - name: Login to Registry
        uses: code-actions/docker-login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Dashboard MCP Server
        uses: code-actions/docker-build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/mcp-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/dice-dashboard-mcp-server:${{ needs.setup.outputs.tag }}
            ${{ env.REGISTRY }}/dice-dashboard-mcp-server:latest
          build-args: |
            REGISTRY_MIRROR=docker-remote.bart.sec.samsung.net/
            BUILD_DATE=${{ needs.setup.outputs.date }}
            VERSION=${{ needs.setup.outputs.tag }}

  build-web-auth:
    needs: [setup]
    if: needs.setup.outputs.web_auth == 'true'
    runs-on: [code-linux, code-xlarge]
    steps:
      - name: Checkout
        uses: code-actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_USERTOKEN }}

      - name: Prepare Docker client config
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: code-actions/docker-setup-buildx-action@v3
        with:
          name: build-web-auth-${{ github.run_id }}-${{ github.run_attempt }}
          driver: docker-container
          use: true

      - name: Login to Registry
        uses: code-actions/docker-login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Web Auth
        uses: code-actions/docker-build-push-action@v5
        with:
          context: .
          file: ./web-auth/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/dice-web-auth:${{ needs.setup.outputs.tag }}
            ${{ env.REGISTRY }}/dice-web-auth:latest
          build-args: |
            REGISTRY_MIRROR=docker-remote.bart.sec.samsung.net/
            BUILD_DATE=${{ needs.setup.outputs.date }}
            VERSION=${{ needs.setup.outputs.tag }}

  build-dashboard:
    needs: [setup]
    if: needs.setup.outputs.dashboard == 'true'
    runs-on: [code-linux, code-xlarge]
    steps:
      - name: Checkout
        uses: code-actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_USERTOKEN }}

      - name: Prepare Docker client config
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: code-actions/docker-setup-buildx-action@v3
        with:
          name: build-dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          driver: docker-container
          use: true

      - name: Login to Registry
        uses: code-actions/docker-login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Dashboard Frontend
        uses: code-actions/docker-build-push-action@v5
        with:
          context: .
          file: ./dashboard/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/dice-dashboard-frontend:${{ needs.setup.outputs.tag }}
            ${{ env.REGISTRY }}/dice-dashboard-frontend:latest
          build-args: |
            REGISTRY_MIRROR=docker-remote.bart.sec.samsung.net/
            NEXT_PUBLIC_BASE_PATH=/dashboard
            NEXT_PUBLIC_AUTH_BASE_URL=
            NEXT_PUBLIC_ACTIVATION_API_URL=/activation/dashboard
            NEXT_PUBLIC_USER_API_URL=/user/api/v1
            BUILD_DATE=${{ needs.setup.outputs.date }}
            VERSION=${{ needs.setup.outputs.tag }}

      - name: Build and Push Dashboard Backend
        uses: code-actions/docker-build-push-action@v5
        with:
          context: .
          file: ./dashboard/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/dice-dashboard-backend:${{ needs.setup.outputs.tag }}
            ${{ env.REGISTRY }}/dice-dashboard-backend:latest
          build-args: |
            REGISTRY_MIRROR=docker-remote.bart.sec.samsung.net/
            GHCR_MIRROR=ghcr-docker-remote.bart.sec.samsung.net/
            BUILD_DATE=${{ needs.setup.outputs.date }}
            VERSION=${{ needs.setup.outputs.tag }}

  build-docs:
    needs: [setup]
    if: needs.setup.outputs.docs == 'true'
    runs-on: [code-linux, code-xlarge]
    steps:
      - name: Checkout
        uses: code-actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_USERTOKEN }}

      - name: Prepare Docker client config
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
