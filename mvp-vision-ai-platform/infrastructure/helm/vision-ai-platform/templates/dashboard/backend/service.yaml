{{- if .Values.dashboard.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vision-ai.dashboardBackend.fullname" . }}
  labels:
    {{- include "vision-ai.dashboardBackend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dashboard.backend.service.type }}
  ports:
    - port: {{ .Values.dashboard.backend.service.port }}
      targetPort: {{ .Values.dashboard.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "vision-ai.dashboardBackend.selectorLabels" . | nindent 4 }}
{{- end }}
