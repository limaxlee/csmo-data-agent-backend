{{- if .Values.dashboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vision-ai.dashboardFrontend.fullname" . }}
  labels:
    {{- include "vision-ai.dashboardFrontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "vision-ai.dashboardFrontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vision-ai.dashboardFrontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.dashboard.frontend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard-frontend
          image: "{{ .Values.dashboard.frontend.image.repository }}:{{ .Values.dashboard.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dashboard.frontend.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.frontend.service.targetPort }}
              protocol: TCP
          env:
            - name: DASHBOARD_BACKEND_API_URL
              value: {{ default (printf "http://%s.%s.svc.cluster.local:%d/api/v1" (include "vision-ai.dashboardBackend.fullname" .) .Release.Namespace (.Values.dashboard.backend.service.port | int)) .Values.dashboard.frontend.env.DASHBOARD_BACKEND_API_URL | quote }}
          {{- with .Values.dashboard.frontend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.dashboard.frontend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.dashboard.frontend.resources | nindent 12 }}
      {{- with .Values.dashboard.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

