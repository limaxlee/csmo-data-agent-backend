{{- if .Values.diceBot.enabled -}}
{{- if .Values.diceBot.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vision-ai.diceBot.serviceAccountName" . }}
  labels:
    {{- include "vision-ai.diceBot.labels" . | nindent 4 }}
  {{- with .Values.diceBot.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
