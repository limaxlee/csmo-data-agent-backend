{{- if .Values.docs.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vision-ai.docs.fullname" . }}
  labels:
    {{- include "vision-ai.docs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.docs.service.type }}
  ports:
    - port: {{ .Values.docs.service.port }}
      targetPort: {{ .Values.docs.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "vision-ai.docs.selectorLabels" . | nindent 4 }}
{{- end }}

