{{- if .Values.labeler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vision-ai.labeler.fullname" . }}-frontend
  labels:
    {{- include "vision-ai.labeler.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.labeler.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vision-ai.labeler.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vision-ai.labeler.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.labeler.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.labeler.frontend.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.labeler.frontend.image.repository }}:{{ .Values.labeler.frontend.image.tag }}"
          {{- with .Values.labeler.frontend.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.labeler.frontend.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.labeler.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.labeler.frontend.port }}
          {{- with .Values.labeler.frontend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.labeler.frontend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.labeler.frontend.env.NEXT_PUBLIC_API_URL | default (printf "http://%s-backend:%d" (include "vision-ai.labeler.fullname" .) (.Values.labeler.backend.port | int)) | quote }}
            {{- range $key, $value := .Values.labeler.frontend.env }}
            {{- if ne $key "NEXT_PUBLIC_API_URL" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}

{{- end }}
