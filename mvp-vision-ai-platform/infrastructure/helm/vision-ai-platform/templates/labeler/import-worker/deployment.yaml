{{- if and .Values.labeler.enabled .Values.labeler.importWorker.enabled (ne (include "vision-ai.consolidation.enabled" .) "true") }}
{{- $imageRepository := default .Values.labeler.backend.image.repository .Values.labeler.importWorker.image.repository }}
{{- $imageTag := default .Values.labeler.backend.image.tag .Values.labeler.importWorker.image.tag }}
{{- $backendEnv := default (dict) .Values.labeler.backend.env }}
{{- $workerEnv := default (dict) .Values.labeler.importWorker.env }}
{{- $env := mergeOverwrite (deepCopy $backendEnv) $workerEnv }}
{{- $env = include "vision-ai.redis.applicationEnv" (dict "root" . "env" $env "database" "labeler") | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vision-ai.labeler.fullname" . }}-import-worker
  labels:
    {{- include "vision-ai.labeler.labels" . | nindent 4 }}
    app.kubernetes.io/component: import-worker
spec:
  replicas: {{ .Values.labeler.importWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vision-ai.labeler.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: import-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vision-ai.labeler.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: import-worker
    spec:
      {{- with .Values.labeler.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.labeler.importWorker.securityContext }}
      securityContext:
        {{- toYaml .Values.labeler.importWorker.securityContext | nindent 8 }}
      {{- else }}
      {{- with .Values.labeler.backend.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: import-worker
          image: "{{ $imageRepository }}:{{ $imageTag }}"
          {{- with .Values.labeler.importWorker.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with .Values.labeler.importWorker.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.labeler.importWorker.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- range $key, $value := $env }}
            {{- include "vision-ai.env.entry" (dict "name" $key "value" $value) | nindent 12 }}
            {{- end }}
          {{- with .Values.labeler.importWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.labeler.importWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.labeler.importWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.labeler.importWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

