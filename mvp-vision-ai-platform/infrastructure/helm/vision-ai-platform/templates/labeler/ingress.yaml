{{- if .Values.labeler.enabled }}
{{- if .Values.labeler.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vision-ai.labeler.fullname" . }}
  labels:
    {{- include "vision-ai.labeler.labels" . | nindent 4 }}
  {{- with .Values.labeler.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  rules:
    - host: {{ .Values.labeler.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "vision-ai.labeler.fullname" . }}-backend
                port:
                  number: {{ .Values.labeler.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vision-ai.labeler.fullname" . }}-frontend
                port:
                  number: {{ .Values.labeler.frontend.port }}
{{- end }}

{{- end }}

