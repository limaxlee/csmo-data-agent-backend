{{- $space := .Values.platform.training.space -}}
{{- if and .Values.platform.backend.enabled .Values.platform.training.enabled $space.enabled $space.credentials.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-space-credentials" (include "vision-ai.backend.fullname" .)) $space.credentials.secretName }}
  labels:
    {{- include "vision-ai.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $space.credentials.usernameKey | default "username" }}: {{ $space.credentials.username | quote }}
  {{ $space.credentials.passwordKey | default "password" }}: {{ $space.credentials.password | quote }}
{{- end }}
