{{- if .Values.platform.dashboardMcp.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vision-ai.dashboardMcp.fullname" . }}
  labels:
    {{- include "vision-ai.dashboardMcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.platform.dashboardMcp.service.type }}
  ports:
    - port: {{ .Values.platform.dashboardMcp.service.port }}
      targetPort: {{ .Values.platform.dashboardMcp.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "vision-ai.dashboardMcp.selectorLabels" . | nindent 4 }}
{{- end }}
