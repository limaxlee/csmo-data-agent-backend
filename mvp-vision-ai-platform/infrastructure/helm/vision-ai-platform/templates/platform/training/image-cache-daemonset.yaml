{{- $training := .Values.platform.training -}}
{{- $cache := $training.imageCache -}}
{{- if and $training.enabled $cache.enabled -}}
{{- if not $cache.nodeNames -}}
{{- fail "platform.training.imageCache.nodeNames must not be empty when imageCache is enabled" -}}
{{- end -}}
{{- $images := dict -}}
{{- range $name, $framework := $training.frameworks -}}
{{- if and $framework.enabled (or $framework.image $framework.image_suffix) -}}
{{- $image := $framework.image -}}
{{- if not $image -}}
{{- $image = printf "%s/%s:%s" $training.registry.url $framework.image_suffix (default "latest" $framework.image_tag) -}}
{{- end -}}
{{- $_ := set $images $name $image -}}
{{- end -}}
{{- end -}}
{{- if not $images -}}
{{- fail "imageCache requires at least one enabled framework with an image or image_suffix" -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "vision-ai.training.fullname" . }}-image-cache
  namespace: {{ include "vision-ai.training.namespace" . }}
  labels:
    {{- include "vision-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: training-image-cache
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: training-image-cache
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ toYaml (default 1 $cache.maxUnavailable) }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: training-image-cache
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      {{- with $training.registry.pullSecret }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              {{- range $cache.nodeNames }}
              - matchFields:
                  - key: metadata.name
                    operator: In
                    values:
                      - {{ . | quote }}
              {{- end }}
      {{- with $cache.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- range $name, $image := $images }}
        - name: {{ $name | replace "_" "-" }}
          image: {{ $image | quote }}
          imagePullPolicy: Always
          command: ["/bin/sleep"]
          args: ["infinity"]
          # CUDA base images may default to exposing all GPUs via the runtime.
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $cache.resources | nindent 12 }}
        {{- end }}
{{- end }}

