{{- if and .Values.platform.training.enabled .Values.platform.training.s3.enabled .Values.platform.training.s3.createSecret }}
# S3/MinIO credentials secret
# In production, use external secret management (e.g., External Secrets Operator)
# To use a pre-created secret, set s3.createSecret=false and s3.secretName.
# Default true preserves existing releases; changing an existing managed Secret
# requires a reviewed ownership migration (do not blindly prune it).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.platform.training.s3.secretName }}
  namespace: {{ include "vision-ai.training.namespace" . }}
  labels:
    {{- include "vision-ai.training.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Placeholder values - override during installation
  # helm install ... --set-string platform.training\.s3.accessKey=xxx --set-string platform.training\.s3.secretKey=xxx
  access-key: {{ .Values.platform.training.s3.accessKey | default "CHANGE_ME" | quote }}
  secret-key: {{ .Values.platform.training.s3.secretKey | default "CHANGE_ME" | quote }}
  {{- if .Values.platform.training.s3.endpoint }}
  endpoint: {{ .Values.platform.training.s3.endpoint | quote }}
  {{- end }}
  {{- if .Values.platform.training.s3.bucket }}
  bucket: {{ .Values.platform.training.s3.bucket | quote }}
  {{- end }}
{{- end }}

