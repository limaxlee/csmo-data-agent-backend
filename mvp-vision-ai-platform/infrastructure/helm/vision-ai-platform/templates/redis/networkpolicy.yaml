{{- if and .Values.redis.enabled .Values.redis.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vision-ai.redis.fullname" . }}
  labels:
    {{- include "vision-ai.redis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vision-ai.redis.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # No namespaceSelector: only matching Pods in the Redis namespace.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
