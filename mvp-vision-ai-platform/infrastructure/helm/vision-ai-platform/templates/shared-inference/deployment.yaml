{{- if .Values.sharedInference.enabled -}}
{{- $name := include "vision-ai.sharedInference.name" . -}}
{{- $secret := include "vision-ai.sharedInference.secret" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ .Values.sharedInference.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $name }}}
      annotations:
        checksum/policy: {{ include "vision-ai.sharedInference.policy" . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 150
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      imagePullSecrets: {{ toYaml .Values.platform.backend.imagePullSecrets | nindent 8 }}
      initContainers:
        - name: schema
          image: "{{ .Values.sharedInference.image.repository }}:{{ .Values.sharedInference.image.tag }}"
          command: [uv, run, --no-sync, python, -m, gateway.schema]
          env:
            - name: GATEWAY_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: GATEWAY_DATABASE_URL}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      containers:
        - name: gateway
          image: "{{ .Values.sharedInference.image.repository }}:{{ .Values.sharedInference.image.tag }}"
          imagePullPolicy: {{ .Values.sharedInference.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: GATEWAY_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: GATEWAY_DATABASE_URL}}
            - name: GATEWAY_CLIENTS_JSON
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: GATEWAY_CLIENTS_JSON}}
            - name: GATEWAY_RUNNER_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "vision-ai.autoLabeling.managedKeyRef" . | nindent 18 }}
            - name: GATEWAY_RUNNERS_JSON
              value: {{ include "vision-ai.sharedInference.policy" . | quote }}
            - {name: GATEWAY_BLOB_ROOT, value: /var/lib/gateway/blobs}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {{ toYaml .Values.sharedInference.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          volumeMounts: [{name: blobs, mountPath: /var/lib/gateway/blobs}]
      volumes:
        - name: blobs
          persistentVolumeClaim:
            claimName: {{ .Values.sharedInference.blobStorage.existingClaim | default $name }}
{{- end -}}
