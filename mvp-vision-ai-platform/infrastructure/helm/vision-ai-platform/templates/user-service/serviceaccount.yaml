{{- if .Values.userService.enabled -}}
{{- if .Values.userService.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vision-ai.userService.serviceAccountName" . }}
  labels:
    {{- include "vision-ai.userService.labels" . | nindent 4 }}
  {{- with .Values.userService.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
