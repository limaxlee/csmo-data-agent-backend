{{- if and .Values.webAuth.enabled .Values.webAuth.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vision-ai.webAuth.serviceAccountName" . }}
  labels:
    {{- include "vision-ai.webAuth.labels" . | nindent 4 }}
  {{- with .Values.webAuth.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
